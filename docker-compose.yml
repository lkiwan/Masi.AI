services:
  postgres:
    image: postgres:16-alpine
    container_name: masi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - masi_net

  api:
    build: .
    container_name: masi_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    command: ["python", "-m", "masi_ai.cli", "api"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - masi_net

  worker:
    build: .
    container_name: masi_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    command: ["python", "-m", "masi_ai.cli", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - masi_net

  dashboard:
    build: .
    container_name: masi_dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8501:8501"
    command: ["python", "-m", "masi_ai.cli", "dashboard"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - masi_net

networks:
  masi_net:
    driver: bridge
